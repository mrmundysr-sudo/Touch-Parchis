# Touch AutoBuild caller. Pinned to the reviewed hub commit (immutable SHA); see autobuild/VERSIONING.md in touch-development.
# Bump the SHA only through a reviewed PR.
# Builds every claude/** branch push and manual dispatch. Publishes only a labelled DEV/TEST prerelease when artifact upload fails.
name: AutoBuild (dev branches)

on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:

permissions:
  contents: write   # lets the shared workflow publish the DEV/TEST prerelease fallback (claude/** only)

concurrency:
  group: autobuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: mrmundysr-sudo/touch-development/.github/workflows/android-build.yml@46c14e78221286918b69282f627eeb0e73c7ad96 # validator candidate (regression test only)
    with:
      artifact_name: Touch-Parchis-debug-${{ github.run_number }}
      project_dir: "TouchParchis"
      java_version: "17"
      tasks: "clean test lintDebug assembleDebug"
