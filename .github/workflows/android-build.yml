name: Android build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TouchParchis
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Grant Gradle permission
        run: chmod +x gradlew
      - name: Build and verify
        run: ./gradlew clean test lintDebug assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: touch-parchis-debug-apk
          path: TouchParchis/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
      - name: Publish APK as pre-release
        if: success() && github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s globstar nullglob
          FILES=(TouchParchis/app/build/outputs/apk/debug/app-debug.apk)
          [ "${#FILES[@]}" -gt 0 ] || { echo "no APK found"; exit 1; }
          gh release create "apk-${{ github.run_number }}-${{ github.run_attempt }}" "${FILES[@]}" \
            --target "${{ github.sha }}" --prerelease \
            --title "APK build ${{ github.run_number }} (${{ github.ref_name }})" \
            --notes "Built from ${{ github.ref_name }} @ ${{ github.sha }}"
